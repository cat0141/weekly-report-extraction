<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{product_line}}运营周报 · 总监视角 — {{date}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; color: #1a1a1a; line-height: 1.8; max-width: 800px; margin: 0 auto; padding: 24px 16px 48px; background: #f0f0f5; }
  .header { text-align: center; padding: 36px 20px; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; border-radius: 16px; margin-bottom: 24px; }
  .header h1 { font-size: 22px; margin-bottom: 6px; font-weight: 800; }
  .header .role { font-size: 13px; opacity: 0.7; margin-bottom: 8px; }
  .header .date { font-size: 14px; opacity: 0.85; }

  .section { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
  .section h2 { font-size: 18px; color: #1a1a2e; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid; display: flex; align-items: center; gap: 8px; }

  /* Insights */
  .insight { border-left: 4px solid #667eea; padding: 10px 14px; margin: 12px 0; background: #f8f9ff; border-radius: 0 6px 6px 0; }
  .insight .title { font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
  .insight .support { font-size: 13px; color: #667; margin: 4px 0; }
  .insight .impact { font-size: 13px; color: #888; }

  /* Risks */
  .risk-high { border-left: 4px solid #ff4d4f; padding: 10px 14px; margin: 10px 0; background: #fff2f0; border-radius: 0 6px 6px 0; }
  .risk-mid { border-left: 4px solid #faad14; padding: 10px 14px; margin: 10px 0; background: #fffbe6; border-radius: 0 6px 6px 0; }
  .risk-low { border-left: 4px solid #52c41a; padding: 10px 14px; margin: 10px 0; background: #f6ffed; border-radius: 0 6px 6px 0; }
  .risk-header { display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .risk-severity { font-size: 11px; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
  .sev-high { background: #ff4d4f; color: #fff; }
  .sev-mid { background: #faad14; color: #fff; }
  .sev-low { background: #52c41a; color: #fff; }

  /* Actions */
  table.actions { width: 100%; border-collapse: collapse; font-size: 14px; margin: 10px 0; }
  table.actions th { background: #f0f0f5; text-align: left; padding: 10px 12px; font-weight: 600; border: 1px solid #e0e0e8; }
  table.actions td { padding: 10px 12px; border: 1px solid #e0e0e8; vertical-align: top; }
  .prio-p0 { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #fff2f0; color: #ff4d4f; font-size: 11px; font-weight: 700; border: 1px solid #ffccc7; }
  .prio-p1 { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #fff7e6; color: #fa8c16; font-size: 11px; font-weight: 700; border: 1px solid #ffd591; }
  .prio-p2 { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #e6f7ff; color: #1890ff; font-size: 11px; font-weight: 700; border: 1px solid #91d5ff; }

  /* Missing data */
  .missing-data { background: #fffbe6; border: 1px solid #ffe58f; border-radius: 8px; padding: 16px; margin: 12px 0; }
  .missing-data h4 { color: #d48806; font-size: 14px; margin-bottom: 8px; }
  .missing-item { font-size: 14px; margin: 6px 0; padding-left: 16px; position: relative; color: #5a4a00; }

  /* Quotes */
  details.quote { margin: 10px 0; border: 1px solid #e8e8f0; border-radius: 8px; overflow: hidden; }
  details.quote[open] summary { background: #f0f0f8; }
  details.quote summary { padding: 10px 14px; background: #fafafc; cursor: pointer; font-size: 13px; color: #667eea; user-select: none; }
  details.quote .quote-content { padding: 14px; font-size: 14px; background: #fefeff; border-top: 1px solid #e8e8f0; }
  details.quote blockquote { margin: 8px 0; padding: 8px 14px; border-left: 3px solid #667eea; background: #f8f8fc; font-size: 13px; color: #555; }

  .director-comment { background: #f0f5ff; border-radius: 8px; padding: 14px; margin: 10px 0; border: 1px solid #d6e4ff; }
  .director-comment .label { font-size: 12px; color: #1d39c4; font-weight: 600; margin-bottom: 4px; }

  .spoiler { color: #ccc; font-size: 12px; text-align: center; padding: 16px; }
</style>
</head>
<body>

<div class="header">
  <h1>{{product_line}} · 运营周报</h1>
  <div class="role">🔭 运营总监视角</div>
  <div class="date">{{date_range}}</div>
</div>

<!-- 核心洞察 -->
<div class="section">
  <h2 style="border-color: #667eea;">💡 核心洞察</h2>
  {{insights}}
</div>

<!-- 风险预警 -->
<div class="section">
  <h2 style="border-color: #ff4d4f;">🚨 风险预警</h2>
  {{risks}}
</div>

<!-- 缺失数据清单 -->
<div class="section">
  <h2 style="border-color: #faad14;">📋 缺失数据清单</h2>
  {{missing_data}}
</div>

<!-- 行动建议 -->
<div class="section">
  <h2 style="border-color: #52c41a;">🎯 行动建议</h2>
  <table class="actions">
    <tr><th>优先级</th><th>行动</th><th>负责人</th><th>截止时间</th><th>验证方式</th></tr>
    {{action_rows}}
  </table>
</div>

<!-- 数据引用 -->
<div class="section">
  <h2 style="border-color: #888;">📄 数据引用</h2>
  {{quotes}}
</div>

<!-- 运营总监点评 -->
<div class="section">
  <h2 style="border-color: #1d39c4;">📌 运营总监点评</h2>
  {{director_comments}}
</div>

<div class="spoiler">—— 由 weekly-report-extraction skill 自动生成 ——</div>

</body>
</html>
